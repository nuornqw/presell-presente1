<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Presell</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(180deg, #0a0a1a 0%, #1a0a2e 100%);
    color: #fff;
    text-align: center;
    padding: 20px;
    overflow-x: hidden;
  }

  h1 {
    font-size: 1.6rem;
    margin-bottom: 10px;
    line-height: 1.3;
    max-width: 500px;
  }

  .sub {
    font-size: 1rem;
    color: #b8b8d0;
    margin-bottom: 40px;
    max-width: 400px;
  }

  /* PRESENTE CLICÁVEL - sem animação de tesoura */
  .gift-box {
    position: relative;
    width: 160px;
    height: 160px;
    cursor: pointer;
    margin-bottom: 30px;
    transition: transform 0.15s ease;
    user-select: none;
  }

  .gift-box:active {
    transform: scale(0.92);
  }

  .gift-box svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 0 20px rgba(255, 200, 50, 0.6));
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  .gift-box.opened svg {
    animation: none;
  }

  .gift-box.opened {
    transform: scale(1.1);
  }

  /* TAP HINT */
  .tap-hint {
    font-size: 1.05rem;
    font-weight: 700;
    color: #ffd54a;
    margin-bottom: 30px;
    animation: blink 1.2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .gift-box.opened ~ .tap-hint,
  .gift-box.opened + .tap-hint {
    display: none;
  }

  /* CTA BUTTON */
  .cta {
    display: inline-block;
    padding: 18px 50px;
    font-size: 1.2rem;
    font-weight: 800;
    color: #0a0a1a;
    background: linear-gradient(90deg, #ffd54a, #ffb300);
    border: none;
    border-radius: 50px;
    text-decoration: none;
    box-shadow: 0 8px 30px rgba(255, 180, 0, 0.5);
    opacity: 0;
    transform: translateY(15px);
    pointer-events: none;
    transition: all 0.4s ease;
  }

  .cta.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .cta:active {
    transform: scale(0.96);
  }
</style>
</head>
<body>

  <h1>🎁 Tem um presente esperando pra você!</h1>
  <p class="sub">Toque no presentinho abaixo para revelar</p>

  <!-- PRESENTE: clique simples, sem tesoura -->
  <div class="gift-box" id="gift" onclick="abrirPresente()">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <!-- caixa -->
      <rect x="15" y="45" width="70" height="45" rx="4" fill="#e63946"/>
      <rect x="15" y="45" width="70" height="12" fill="#c1121f"/>
      <!-- fita vertical -->
      <rect x="45" y="45" width="10" height="45" fill="#ffd54a"/>
      <!-- tampa -->
      <rect x="10" y="35" width="80" height="14" rx="3" fill="#ff4d5e"/>
      <rect x="45" y="35" width="10" height="14" fill="#ffd54a"/>
      <!-- laço -->
      <ellipse cx="38" cy="30" rx="12" ry="9" fill="none" stroke="#ffd54a" stroke-width="5"/>
      <ellipse cx="62" cy="30" rx="12" ry="9" fill="none" stroke="#ffd54a" stroke-width="5"/>
      <circle cx="50" cy="32" r="5" fill="#ffd54a"/>
    </svg>
  </div>

  <p class="tap-hint" id="hint">👆 Toque para abrir</p>

  <!-- Troque o href pelo seu link de destino -->
  <a href="https://serverflow.dad/l/444ac4fd?shk=xo9znaku" class="cta" id="cta">QUERO MEU PRESENTE 🎁</a>

<script>
  function abrirPresente() {
    const gift = document.getElementById('gift');
    const hint = document.getElementById('hint');
    const cta = document.getElementById('cta');

    // evita re-clique
    if (gift.classList.contains('opened')) return;

    gift.classList.add('opened');
    hint.style.display = 'none';

    // mostra o botão depois de um pequeno delay
    setTimeout(() => {
      cta.classList.add('show');
    }, 250);
  }
</script>

</body>
</html>
